name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ── Free Disk Space (Prevents "No space left on device" runner crash) ──
      - name: Free Disk Space
        run: |
          echo "=== Freeing runner disk space ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /var/lib/docker
          echo "=== Disk space after cleanup ==="
          df -h

      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java 17 (required by AGP 8.x) ───────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Flutter ──────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      # ── Dependencies ─────────────────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── Analyze (optional but catches errors early) ───────────────────────
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # ── Build release APK ─────────────────────────────────────────────────
      - name: Build release APK
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

