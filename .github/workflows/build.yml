name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  build:
    name: Build Release APKs (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [lite, full]

    steps:
      # ── Free Disk Space (Prevents "No space left on device" runner crash) ──
      - name: Free Disk Space
        run: |
          echo "=== Freeing runner disk space ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /var/lib/docker
          echo "=== Disk space after cleanup ==="
          df -h

      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java 17 (required by AGP 8.x) ───────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Flutter ──────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      # ── Dependencies ─────────────────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── Analyze (optional but catches errors early) ───────────────────────
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # ── Prepare Artifacts Staging ─────────────────────────────────────────
      - name: Prepare Artifacts Directory
        run: mkdir -p build-artifacts

      # ── Configure Build Flavor ──────────────────────────────────────────
      - name: Configure Slim (Lite Only)
        if: matrix.flavor == 'lite'
        run: |
          dart run tool/configure_build.dart --slim
          flutter pub get

      - name: Configure Bundled Models (Full Only)
        if: matrix.flavor == 'full'
        run: |
          dart run tool/download_models.dart
          dart run tool/configure_build.dart --bundled
          flutter pub get

      # ── Build Release APKs ───────────────────────────────────────────────
      - name: Build ${{ matrix.flavor }} Release APKs
        run: |
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-*-release.apk build-artifacts/

      # ── Upload Artifacts ──────────────────────────────────────────────────
      - name: Upload ${{ matrix.flavor }} Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor }}-release-apks
          path: build-artifacts/app-*-release.apk
          retention-days: 30
