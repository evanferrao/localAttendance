name: Build & Publish Signed Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release (AAB & APK)
    runs-on: ubuntu-latest

    steps:
      # ── Free Disk Space (Prevents "No space left on device" runner crash) ──
      - name: Free Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /var/lib/docker
          echo "=== Disk space after cleanup ==="
          df -h

      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java 17 (Required by modern Android Gradle Plugin) ──────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Flutter Setup ───────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      # ── Decode Keystore from GitHub Secret ──────────────────────────────
      - name: Restore Upload Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      # ── Create key.properties dynamically from Secrets ──────────────────
      - name: Configure key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # ── Install Dependencies ────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── Create output staging folder ────────────────────────────────────
      - name: Prepare Artifacts Directory
        run: mkdir -p release-artifacts

      # ── Build Signed Lite Release (AAB & Universal APK) ─────────────────
      - name: Build Signed Lite Release (Models Excluded, ~25MB)
        run: |
          dart run tool/configure_build.dart --slim
          flutter pub get
          flutter build appbundle --release --android-skip-build-dependency-validation
          cp build/app/outputs/bundle/release/app-release.aab release-artifacts/LocalAttendance-lite-release.aab
          flutter build apk --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/LocalAttendance-lite-release.apk

      # ── Clean Intermediate Build Cache (Prevents runner disk exhaustion) ──
      - name: Clean intermediate build
        run: |
          flutter clean
          flutter pub get

      # ── Build Signed Full Release (AAB & Universal APK) ─────────────────
      - name: Build Signed Full Release (Models Pre-Packaged, ~200MB+)
        run: |
          dart run tool/download_models.dart
          dart run tool/configure_build.dart --bundled
          flutter pub get
          flutter build appbundle --release --android-skip-build-dependency-validation
          cp build/app/outputs/bundle/release/app-release.aab release-artifacts/LocalAttendance-full-release.aab
          flutter build apk --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/LocalAttendance-full-release.apk

      # ── Publish GitHub Release ──────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            release-artifacts/LocalAttendance-lite-release.aab
            release-artifacts/LocalAttendance-lite-release.apk
            release-artifacts/LocalAttendance-full-release.aab
            release-artifacts/LocalAttendance-full-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
