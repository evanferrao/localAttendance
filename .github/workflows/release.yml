name: Build & Publish Signed Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [lite, full]

    steps:
      # ── Free Disk Space (Prevents "No space left on device" runner crash) ──
      - name: Free Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /var/lib/docker
          echo "=== Disk space after cleanup ==="
          df -h

      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java 17 (Required by modern Android Gradle Plugin) ──────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Flutter Setup ───────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      # ── Decode Keystore from GitHub Secret ──────────────────────────────
      - name: Restore Upload Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      # ── Create key.properties dynamically from Secrets ──────────────────
      - name: Configure key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # ── Install Dependencies ────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── Create output staging folder ────────────────────────────────────
      - name: Prepare Artifacts Directory
        run: mkdir -p release-artifacts

      # ── Configure Build Flavor ──────────────────────────────────────────
      - name: Configure Slim (Lite Only)
        if: matrix.flavor == 'lite'
        run: |
          dart run tool/configure_build.dart --slim
          flutter pub get

      - name: Configure Bundled Models (Full Only)
        if: matrix.flavor == 'full'
        run: |
          dart run tool/download_models.dart
          dart run tool/configure_build.dart --bundled
          flutter pub get

      # ── Build Signed Release (AAB & Universal APK) ──────────────────────
      - name: Build Signed ${{ matrix.flavor }} Release (AAB & APK)
        run: |
          flutter build appbundle --release --android-skip-build-dependency-validation
          cp build/app/outputs/bundle/release/app-release.aab release-artifacts/LocalAttendance-${{ matrix.flavor }}-release.aab
          flutter build apk --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/LocalAttendance-${{ matrix.flavor }}-release.apk

      # ── Upload Staged Artifacts ─────────────────────────────────────────
      - name: Upload ${{ matrix.flavor }} Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor }}-release-artifacts
          path: release-artifacts/*
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-release-artifacts'
          path: release-artifacts
          merge-multiple: true

      - name: Verify downloaded artifacts
        run: |
          echo "=== Downloaded release artifacts ==="
          ls -la release-artifacts

      # ── Publish GitHub Release ──────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            release-artifacts/LocalAttendance-lite-release.aab
            release-artifacts/LocalAttendance-lite-release.apk
            release-artifacts/LocalAttendance-full-release.aab
            release-artifacts/LocalAttendance-full-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
