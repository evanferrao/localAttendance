plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.face_att"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.face_att"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled = false
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }
}

flutter {
    source = "../.."
}

task downloadMissingModels {
    description = "Downloads missing ONNX models required for face recognition if not present"
    doLast {
        def assetsDir = file("${projectDir}/../../assets")
        if (!assetsDir.exists()) {
            assetsDir.mkdirs()
        }

        def models = [
            [name: "w600k_r50.onnx", url: "https://huggingface.co/maze/faceX/resolve/main/w600k_r50.onnx"],
            [name: "w600k_mbf.onnx", url: "https://huggingface.co/deepghs/insightface/resolve/main/buffalo_s/w600k_mbf.onnx"]
        ]

        models.each { model ->
            def targetFile = new File(assetsDir, model.name)
            if (!targetFile.exists() || targetFile.length() == 0) {
                println "⬇️ [Face Recognition] Downloading missing model ${model.name}..."
                def tempFile = new File(assetsDir, "${model.name}.tmp")
                
                def downloadUrl = model.url
                def maxRedirects = 5
                def redirectCount = 0
                HttpURLConnection conn = null

                while (redirectCount < maxRedirects) {
                    conn = (HttpURLConnection) new URL(downloadUrl).openConnection()
                    conn.setInstanceFollowRedirects(true)
                    conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64)")
                    conn.connect()

                    int status = conn.responseCode
                    if (status >= 300 && status < 400) {
                        def location = conn.getHeaderField("Location")
                        if (location != null) {
                            downloadUrl = location
                            redirectCount++
                            continue
                        }
                    }
                    break
                }

                if (conn.responseCode != 200) {
                    println "⚠️ Warning: Failed to download ${model.name} (HTTP ${conn.responseCode})"
                    return
                }

                long totalBytes = conn.contentLengthLong
                long downloadedBytes = 0
                int lastPercent = -1

                conn.inputStream.withCloseable { input ->
                    tempFile.withOutputStream { output ->
                        byte[] buffer = new byte[65536]
                        int bytesRead
                        while ((bytesRead = input.read(buffer)) != -1) {
                            output.write(buffer, 0, bytesRead)
                            downloadedBytes += bytesRead
                            if (totalBytes > 0) {
                                int percent = (int) ((downloadedBytes * 100) / totalBytes)
                                if (percent % 10 == 0 && percent != lastPercent) {
                                    println "⬇️ [Face Recognition] Downloading ${model.name}: ${percent}% (${downloadedBytes / (1024 * 1024)}MB / ${totalBytes / (1024 * 1024)}MB)"
                                    lastPercent = percent
                                }
                            }
                        }
                    }
                }

                if (tempFile.exists() && tempFile.length() > 0) {
                    tempFile.renameTo(targetFile)
                    println "✅ [Face Recognition] Successfully downloaded ${model.name} (${targetFile.length() / (1024 * 1024)}MB)"
                }
            } else {
                println "ℹ️ [Face Recognition] Model ${model.name} already exists. Skipping download."
            }
        }
    }
}

tasks.matching { it.name.startsWith("compileFlutterBuild") || it.name == "preBuild" }.configureEach {
    dependsOn downloadMissingModels
}

